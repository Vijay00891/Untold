services:
  postgres:
    image: postgres:16-alpine
    container_name: untold-postgres
    environment:
      POSTGRES_USER: untold
      POSTGRES_PASSWORD: untold
      POSTGRES_DB: untold
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: untold-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
